<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #1A1A1A;
            background: #F8F9FA;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0A1E3D;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 0.875rem;
            color: #6B7280;
        }

        .section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6B7280;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            font-size: 0.875rem;
            font-family: 'SF Mono', monospace;
            border: 1.5px solid #E5E7EB;
            border-radius: 8px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #00D9FF;
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        button {
            padding: 10px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            background: #0A1E3D;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #00D9FF;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .examples {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .example-btn {
            width: 100%;
            padding: 12px;
            text-align: left;
            background: white;
            color: #1A1A1A;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .example-btn:hover {
            background: #0A1E3D;
            color: white;
            transform: none;
        }

        .example-label {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .example-value {
            font-size: 0.75rem;
            opacity: 0.7;
            font-family: 'SF Mono', monospace;
        }

        .info {
            margin-top: 16px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
        }

        .info-text {
            font-size: 0.75rem;
            color: #6B7280;
            line-height: 1.5;
        }

        .link {
            color: #00D9FF;
            text-decoration: none;
            font-weight: 600;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Scale</div>
        <div class="tagline">Make numbers human</div>
    </div>

    <div class="section">
        <div class="section-title">Visualize a number</div>
        <div class="input-group">
            <input
                type="text"
                id="numberInput"
                placeholder="Enter number..."
                autocomplete="off"
            />
            <button id="goBtn">Go</button>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Quick examples</div>
        <div class="examples">
            <button class="example-btn" data-number="1000000">
                <span class="example-label">One million</span>
                <span class="example-value">1,000,000</span>
            </button>
            <button class="example-btn" data-number="1000000000">
                <span class="example-label">One billion</span>
                <span class="example-value">1,000,000,000</span>
            </button>
            <button class="example-btn" data-number="7900000000">
                <span class="example-label">World population</span>
                <span class="example-value">7.9 billion</span>
            </button>
        </div>
    </div>

    <div class="info">
        <div class="info-text">
            Numbers on web pages are automatically highlighted. Click them to visualize!
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
